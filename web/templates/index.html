<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>mdadm-notifier</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <main>
    <header>
      <div>
        <h1 id="title">mdadm-notifier</h1>
        <div class="meta" id="subtitle">Loading status…</div>
      </div>
      <div class="header-actions">
        <button type="button" id="refresh-button" class="refresh-button">Refresh</button>
        <div id="overall-badge" class="badge neutral">Loading</div>
      </div>
    </header>

    <div id="content" class="grid">
      <section class="card">
        <p class="empty">Waiting for the first health check…</p>
      </section>
    </div>
  </main>

  <script type="module" src="/static/js/app.js"></script>
</body>
</html>
